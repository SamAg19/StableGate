[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
ffi = true
fs_permissions = [{ access = "read", path = "./" }]
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
unichain_mainnet = "https://mainnet.unichain.org"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
reactive_lasna = "${REACTIVE_LASNA_RPC}"