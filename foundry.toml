[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
ffi = true
fs_permissions = [{ access = "read", path = "./" }]
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
base_mainnet = "https://mainnet.base.org"
unichain_mainnet = "https://mainnet.unichain.org"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
reactive_lasna = "${REACTIVE_LASNA_RPC}"